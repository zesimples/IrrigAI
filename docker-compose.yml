# Docker's json-file driver is unbounded by default. The worker's log reached
# 12G during the 2026-08-13 outage — 11 days of DB-connection errors with
# nothing to rotate them — which was the second-largest consumer of the disk
# that outage filled. Every service caps its logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-irrigai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irrigai_dev}
      POSTGRES_DB: ${POSTGRES_DB:-irrigai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-irrigai} -d ${POSTGRES_DB:-irrigai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-irrigai}:${POSTGRES_PASSWORD:-irrigai_dev}@db:5432/${POSTGRES_DB:-irrigai}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-irrigai}:${POSTGRES_PASSWORD:-irrigai_dev}@db:5432/${POSTGRES_DB:-irrigai}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  # Dedicated scheduler worker — the only process that runs APScheduler.
  # Single replica enforces exactly-one execution; Redis job locks protect
  # against concurrent runs during restarts.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-irrigai}:${POSTGRES_PASSWORD:-irrigai_dev}@db:5432/${POSTGRES_DB:-irrigai}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-irrigai}:${POSTGRES_PASSWORD:-irrigai_dev}@db:5432/${POSTGRES_DB:-irrigai}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The worker has no HTTP server — probe the Redis scheduler heartbeat
      # (stamped on startup and after every job tick). Fails if it goes stale.
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Internal URL used by Next.js server-side proxy — never reaches the browser
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  db-backup:
    image: timescale/timescaledb:latest-pg16
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-irrigai}
      PGPASSWORD: ${POSTGRES_PASSWORD:-irrigai_dev}
      PGDATABASE: ${POSTGRES_DB:-irrigai}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-20480}
      # Full restore-verification is expensive (~20GB transient, ~45min on prod
      # as of 2026-08-24), so it runs periodically; every cycle still checks
      # archive integrity and pg_dump's completion trailer.
      BACKUP_FULL_VERIFY_INTERVAL_DAYS: ${BACKUP_FULL_VERIFY_INTERVAL_DAYS:-7}
      BACKUP_FULL_VERIFY_MIN_FREE_MB: ${BACKUP_FULL_VERIFY_MIN_FREE_MB:-30720}
    volumes:
      - ./backups:/backups
      - ./ops/db-backup.sh:/usr/local/bin/db-backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Logic lives in ops/db-backup.sh (tested by ops/tests/test_db_backup.sh).
    # It was inline here until 2026-08-13, when an `&&` chain let a failed
    # pg_dump skip both the retention purge and the sleep — a tight loop that
    # filled the disk and took production down for 11 days.
    entrypoint: ["/usr/local/bin/db-backup.sh"]

volumes:
  postgres_data:
  redis_data:
